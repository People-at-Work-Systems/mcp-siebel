[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-siebel"
version = "0.1.0"
description = "MCP server for Oracle Siebel CRM 26.2+"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "People at Work Systems Software" }]
keywords = ["mcp", "siebel", "oracle", "crm", "model-context-protocol"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=2.0,<3",  # v2 lowlevel Server uses on_list_tools/on_call_tool constructor kwargs (decorators removed in 2.0)
    "httpx>=0.28",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
http = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "prometheus-fastapi-instrumentator>=0.11",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff",
    "mypy",
    "build",
    "mcp-siebel[http]",  # the test suite exercises http_server, so dev pulls the http extra
]

[project.scripts]
mcp-siebel = "mcp_siebel.stdio:main"
mcp-siebel-http = "mcp_siebel._http_entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_siebel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true